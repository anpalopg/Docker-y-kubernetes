apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cart-service

  template:
    metadata:
      labels:
        app: cart-service

    spec:
      containers:
      - name: cart-service
        image: cart-service:1.0
        imagePullPolicy: Never

        ports:
        - containerPort: 3003

---
apiVersion: v1
kind: Service

metadata:
  name: cart-service

spec:
  selector:
    app: cart-service

  ports:
  - port: 80
    targetPort: 3003

  type: NodePort
