apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: users-service

  template:
    metadata:
      labels:
        app: users-service

    spec:
      containers:
      - name: users-service
        image: users-service:1.0
        imagePullPolicy: Never

        ports:
        - containerPort: 3001

---
apiVersion: v1
kind: Service

metadata:
  name: users-service

spec:
  selector:
    app: users-service

  ports:
  - port: 80
    targetPort: 3001

  type: NodePort
